<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache">
<title>SRR — Indoor Breeding Rooms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --blue:#1877f2;--blue-dk:#166fe5;--blue-lt:#e7f3ff;
  --bg:#f0f2f5;--surface:#fff;--border:#dde1e7;--text:#050505;--muted:#65676b;--hover:#f2f3f5;
  --green:#42b72a;--green-dk:#1a5c0c;--green-lt:#e6f4ea;
  --red:#fa3e3e;--red-dk:#9b1c1c;--red-lt:#fdeaea;
  --amber:#f7b928;--amber-dk:#856404;--amber-lt:#fff3cd;
  --purple:#7c3aed;--purple-lt:#f3e8ff;
  --font:'Inter','Noto Sans Myanmar',sans-serif;--r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;min-height:100vh;padding-bottom:70px}
.my{font-family:'Noto Sans Myanmar',var(--font);font-weight:400;color:var(--muted);font-size:.85em}
button{font-family:var(--font)}

/* NAV + TABS */
.nav{background:var(--blue);height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:300;box-shadow:0 2px 8px rgba(24,119,242,.3);gap:10px}
.nav-logo{display:flex;align-items:center;gap:10px;color:#fff;min-width:0}
.nav-ico{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.nav-name{font-size:15px;font-weight:700;line-height:1.2;white-space:nowrap}
.nav-sub{font-size:10.5px;color:rgba(255,255,255,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);cursor:pointer;white-space:nowrap}
.pill.ok{background:#e6f4ea;color:var(--green-dk);border-color:var(--green)}
.pill.warn{background:var(--amber-lt);color:var(--amber-dk);border-color:var(--amber)}
.pill.err{background:var(--red-lt);color:var(--red-dk);border-color:var(--red)}
.clock{font-size:11px;color:rgba(255,255,255,.85);white-space:nowrap}
.tabs{background:var(--surface);border-bottom:1px solid var(--border);display:flex;padding:0 12px;overflow-x:auto;position:sticky;top:56px;z-index:250}
.tab{padding:10px 14px;border:none;background:transparent;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;line-height:1.25;text-align:center}
.tab .my{display:block;font-size:10px}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.tab:hover{background:var(--hover)}
.main{max-width:1100px;margin:0 auto;padding:14px 12px}

/* CARDS / FIELDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 1px 2px rgba(0,0,0,.06);margin-bottom:12px;overflow:hidden}
.card-h{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fafbfc}
.card-t{font-size:14px;font-weight:800}
.card-b{padding:12px 14px}
.lbl{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;margin-bottom:3px;display:block}
.lbl .my{text-transform:none;letter-spacing:0;font-size:10.5px}
.in{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:14px;font-family:var(--font);color:var(--text);background:var(--bg);outline:none}
.in:focus{border-color:var(--blue);background:#fff}
textarea.in{resize:vertical;min-height:60px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.fld{margin-bottom:10px}
.btn{padding:9px 16px;border-radius:8px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:700;cursor:pointer;color:var(--text);line-height:1.2}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-dk)}
.btn.grn{background:var(--green);border-color:var(--green);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}
.btn .my{color:inherit;opacity:.85}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1;min-width:58px;padding:7px 6px;border-radius:7px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);line-height:1.15}
.seg button .my{display:block;font-size:9.5px;color:inherit}
.seg button.on.ok,.seg button.on.on_{background:var(--green-lt);border-color:var(--green);color:var(--green-dk)}
.seg button.on.off{background:#eceef1;border-color:#8a8d91;color:#333}
.seg button.on.bad{background:var(--red-lt);border-color:var(--red);color:var(--red-dk)}
.seg button.on.mid{background:var(--amber-lt);border-color:var(--amber);color:var(--amber-dk)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;background:var(--hover);color:var(--muted);border:1px solid var(--border);white-space:nowrap}
.chip.b{background:var(--blue-lt);color:var(--blue);border-color:#9cc4f7}
.chip.g{background:var(--green-lt);color:var(--green-dk);border-color:#9fd89a}
.chip.r{background:var(--red-lt);color:var(--red-dk);border-color:#f3a5a5}
.chip.a{background:var(--amber-lt);color:var(--amber-dk);border-color:#f2d27d}

/* TOP BAR (employee / room / date) */
.topbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.topbar .f-emp{flex:1;min-width:160px}
.rooms{display:flex;gap:6px;flex-wrap:wrap}
.room-btn{padding:7px 12px;border-radius:8px;border:1.5px solid var(--border);background:#fff;font-weight:800;font-size:13px;cursor:pointer;line-height:1.15;text-align:center;min-width:76px}
.room-btn small{display:block;font-size:10px;font-weight:600;color:var(--muted)}
.room-btn.on{background:var(--blue);border-color:var(--blue);color:#fff}
.room-btn.on small{color:rgba(255,255,255,.85)}
.datebox{display:flex;gap:4px;align-items:center}
.datebox .in{width:150px}
.datebox .btn{padding:8px 10px}

/* CAGE GRID */
.prog{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.bar{height:8px;background:#e4e6eb;border-radius:4px;overflow:hidden;width:160px}
.bar > i{display:block;height:100%;background:var(--green)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:800;line-height:1.1}
.stat span{font-size:10.5px;color:var(--muted);font-weight:600}
.cage-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.cage{position:relative;border:2px solid var(--border);border-radius:9px;background:#fff;padding:7px 6px;cursor:pointer;text-align:center;min-height:74px;transition:transform .08s}
.cage:hover{transform:translateY(-1px);border-color:var(--blue)}
.cage .no{font-size:17px;font-weight:800;line-height:1}
.cage .sx{font-size:11px;font-weight:700;color:var(--muted);margin-top:3px}
.cage .st{font-size:9.5px;font-weight:700;margin-top:3px;color:var(--muted)}
.cage.today{border-color:var(--green);background:#f1fbef}
.cage.today .st{color:var(--green-dk)}
.cage.week{border-color:#a7dca0;background:#fbfffa}
.cage.poor{box-shadow:inset 4px 0 0 var(--amber)}
.cage .lb{position:absolute;top:-7px;left:-7px;background:#1a7f37;color:#fff;font-size:10.5px;font-weight:800;border-radius:10px;padding:1px 6px;border:2px solid #fff}
.lrow{display:grid;grid-template-columns:44px 130px 1fr 34px;gap:6px;align-items:center;margin-bottom:6px}
.lrow .tag{font-size:16px;text-align:center;background:var(--green-lt);border-radius:6px;padding:4px 0}
.laybtn{padding:7px 10px;border-radius:8px;border:1.5px solid #1a7f37;color:#1a7f37;background:#fff;font-weight:800;font-size:12px;cursor:pointer;line-height:1.15;text-align:center}
.laybtn small{display:block;font-weight:500;font-size:9.5px}
table.gt td.g{font-weight:800;text-align:left}
table.gt tr.tot td{background:#f5f6f8;font-weight:800;border-top:2px solid var(--border)}
table.gt td.lay{background:#f1fbef;color:var(--green-dk);font-weight:800}
.gdash-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.gbig{border-radius:14px;padding:16px;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.gbig b{display:block;font-size:40px;font-weight:800;line-height:1.05}
.gbig span{font-size:12px;font-weight:700;opacity:.95}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;margin-bottom:12px}
.gcard{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.gcard-h{padding:12px 16px;color:#fff;display:flex;align-items:center;gap:10px}
.gcard-h .gn{font-size:30px;font-weight:800;line-height:1}
.gcard-h .gs{font-size:12px;font-weight:600;opacity:.95;line-height:1.35}
.gnums{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--border)}
.gnum{padding:12px 14px;text-align:center}
.gnum + .gnum{border-left:1px solid var(--border)}
.gnum b{display:block;font-size:44px;font-weight:800;line-height:1}
.gnum span{font-size:11.5px;font-weight:700;color:var(--muted)}
.gmini{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;padding:8px 6px;gap:4px;border-bottom:1px solid var(--border)}
.gmini b{display:block;font-size:17px;font-weight:800}
.gmini span{font-size:10px;color:var(--muted);font-weight:700;line-height:1.2}
.glay{padding:10px 14px;border-bottom:1px solid var(--border)}
.glay .bar2{display:flex;height:12px;border-radius:6px;overflow:hidden;background:#e4e6eb;margin:6px 0 4px}
.glay .bar2 i{display:block;height:100%}
.grooms{padding:8px 14px 12px}
.grooms table{width:100%;border-collapse:collapse;font-size:12.5px}
.grooms td,.grooms th{padding:4px 4px;text-align:center;border-bottom:1px solid #f0f1f3}
.grooms th{font-size:10px;color:var(--muted);font-weight:800}
.grooms td:first-child,.grooms th:first-child{text-align:left;font-weight:800}
.gcard.empty{opacity:.55}
.cage .fb{position:absolute;top:-7px;right:-7px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;border-radius:10px;padding:1px 6px;border:2px solid #fff}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:2px solid var(--border);vertical-align:-2px;margin-right:4px}

/* SHEET (cage editor) */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:none;align-items:flex-start;justify-content:center;padding:14px 8px;overflow-y:auto}
.ov.open{display:flex}
.sheet{background:#fff;border-radius:12px;width:100%;max-width:760px;box-shadow:0 10px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;max-height:calc(100vh - 28px)}
.sheet-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border)}
.sheet-t{font-size:16px;font-weight:800;flex:1;line-height:1.2}
.sheet-b{padding:12px 14px;overflow-y:auto}
.sheet-f{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--border);flex-wrap:wrap}
.x{width:34px;height:34px;border-radius:50%;border:none;background:#f0f2f5;font-size:15px;cursor:pointer;flex-shrink:0}
.sec{font-size:11px;font-weight:800;color:var(--blue);letter-spacing:.04em;text-transform:uppercase;margin:14px 0 8px;padding-top:10px;border-top:1px solid var(--border)}
.sec:first-child{margin-top:0;border-top:none;padding-top:0}
.sec .my{text-transform:none;letter-spacing:0;color:var(--muted)}
.timebox{display:flex;gap:6px;align-items:center}
.timebox .in{flex:1;min-width:0}
.tbx{display:flex;align-items:center;gap:5px;flex:1;min-width:0}
.tbx .tin{width:86px;flex:0 0 86px;text-align:center;font-weight:800;letter-spacing:.5px;padding:7px 6px}
.tbx .tin.bad{border-color:var(--red);background:var(--red-lt)}
.t12{font-size:10.5px;color:var(--muted);font-weight:700;white-space:nowrap}
.per{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.per .dash{font-weight:800;color:var(--muted)}
.per .tbx{flex:0 0 auto}
.per .t12{min-width:58px}
.per .pn{font-size:10.5px;font-weight:800;color:var(--blue);background:var(--blue-lt);border-radius:10px;padding:2px 7px}
.mh.none{background:#f5f6f7;color:var(--muted)}
.timebox .btn{flex-shrink:0;padding:5px 8px}
.prefill{background:var(--amber-lt);border:1px solid #f2d27d;color:var(--amber-dk);border-radius:8px;padding:7px 10px;font-size:12px;font-weight:600;margin-bottom:10px}
.ftypes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.ftype{padding:7px 10px;border-radius:8px;border:1.5px solid;background:#fff;font-weight:800;font-size:12px;cursor:pointer;line-height:1.15;text-align:center}
.ftype small{display:block;font-weight:500;font-size:9.5px}
.frow{display:grid;grid-template-columns:76px 110px 90px 1fr 34px;gap:6px;align-items:center;margin-bottom:6px}
.frow .tag{font-size:11px;font-weight:800;padding:6px 4px;border-radius:6px;text-align:center;color:#fff}
.frow .seg button{min-width:0;padding:6px 2px}
.gp-display{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:7px;padding:8px 10px;font-size:13px;font-weight:600;cursor:pointer;min-height:38px;line-height:1.3}
.gp-display.empty{color:var(--muted);font-weight:500}
.stepper{display:flex;gap:4px}
.stepper .in{text-align:center;font-weight:800}
.stepper .btn{padding:6px 12px;font-size:16px}

/* GENE PICKER */
#gp-modal{z-index:700}
.gp-group{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:12px 0 6px}
.gp-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
.gp-item{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 0;cursor:pointer}

/* ROOM CHECK */
.banner{border-radius:var(--r);padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;border:2px solid var(--border);background:var(--surface)}
.banner.now{border-color:var(--blue);background:var(--blue-lt);color:var(--blue)}
.banner.soon{border-color:var(--amber);background:var(--amber-lt);color:var(--amber-dk)}
.banner.done{border-color:var(--green);background:var(--green-lt);color:var(--green-dk)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px}
.slot{border:2px solid var(--border);border-radius:9px;padding:8px;background:#fff}
.slot .tm{font-weight:800;font-size:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.slot .in{padding:6px 8px;font-size:14px;font-weight:700;text-align:center;margin-bottom:5px}
.slot.saved{border-color:var(--green);background:#f6fff4}
.slot.missed{border-color:var(--red);background:#fff7f7}
.slot.now{border-color:var(--blue);box-shadow:0 0 0 3px rgba(24,119,242,.18)}
.slot .u{font-size:10px;color:var(--muted);font-weight:600}
.unit{border:1.5px solid var(--border);border-radius:9px;padding:10px;background:#fcfcfd}
.unit-h{font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.timer-tbl{width:100%;border-collapse:collapse}
.timer-tbl th{font-size:10.5px;color:var(--muted);text-align:left;padding:4px;font-weight:700}
.timer-tbl td{padding:6px 4px;vertical-align:top;border-bottom:1px solid #eef0f3}
.timer-tbl td:first-child{font-weight:800;font-size:13px;white-space:nowrap}
.bulbs{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.bulb{border:1.5px solid var(--green);background:var(--green-lt);color:var(--green-dk);border-radius:6px;font-size:11px;font-weight:800;padding:6px 0;text-align:center;cursor:pointer;user-select:none}
.bulb.bad{border-color:var(--red);background:var(--red);color:#fff}
.mh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:6px}
.mh{display:flex;align-items:center;gap:4px;border:1px solid var(--border);border-radius:7px;padding:4px 6px;font-size:12px;background:#fff}
.mh b{width:30px;flex-shrink:0}
.mh select{flex:1;min-width:0;padding:4px;border:1px solid var(--border);border-radius:5px;font-size:12px;font-family:var(--font);background:var(--bg)}
.mh.bad{border-color:var(--red);background:#fff5f5}
.savebar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);padding:10px 14px;display:flex;gap:10px;justify-content:center;align-items:center;z-index:260;box-shadow:0 -2px 10px rgba(0,0,0,.06);flex-wrap:wrap}
.savebar .note{font-size:12px;color:var(--muted);font-weight:600}
.changes{font-size:12px;line-height:1.6}
.changes div{border-bottom:1px dashed var(--border);padding:3px 0}

/* STATS / HISTORY */
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff}
table.t th{background:#f5f6f8;font-size:10.5px;font-weight:800;color:var(--muted);padding:7px 9px;text-align:center;border-bottom:2px solid var(--border);white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:6px 9px;border-bottom:1px solid #eef0f3;text-align:center;white-space:nowrap}
table.t tr.grp td{background:#f0f6ff;font-weight:800;color:var(--blue);font-size:11px;text-transform:uppercase;letter-spacing:.03em}
table.t td.hi{background:var(--red-lt);color:var(--red-dk);font-weight:800}
table.t td.best{background:var(--green-lt);color:var(--green-dk);font-weight:800}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.chart-box{position:relative;height:250px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.empty{color:var(--muted);text-align:center;padding:24px;font-size:13px}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(10px);padding:10px 18px;border-radius:9px;font-size:13px;font-weight:600;opacity:0;transition:all .25s;z-index:900;pointer-events:none;background:#050505;color:#fff;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--green)}.toast.err{background:var(--red)}

@media(max-width:640px){
  .units{grid-template-columns:1fr}
  .timer-tbl,.timer-tbl tbody,.timer-tbl tr,.timer-tbl td{display:block;width:100%}
  .timer-tbl tr:first-child{display:none}
  .timer-tbl td{border-bottom:none;padding:4px 0}
  .timer-tbl tr{border-bottom:1px solid #eef0f3;padding:6px 0;position:relative}
  .timer-tbl td:last-child{position:absolute;top:8px;right:0;width:auto}
  .per{flex-wrap:nowrap}
  .per .t12{display:none}
  .mh-grid{grid-template-columns:1fr 1fr}
  .mh{flex-wrap:wrap}
  .mh b{width:100%}
  .g3,.g4{grid-template-columns:1fr 1fr}
  .nav-name{font-size:13.5px}
  .clock{display:none}
  .frow{grid-template-columns:64px 1fr 74px 34px}
  .frow .gp-display{grid-column:1 / -1;order:5}
  .bulbs{grid-template-columns:repeat(8,1fr)}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo">

// ══════════════════════════════════════════════════════════════════

  {k:'SW',   en:'Swollen joints', my:'အဆစ်ရောင်',      c:'#d97706'},

  {k:'MR',   en:'Mouth rot',      my:'ပါးစပ်ပုပ်',      c:'#be185d'},

var LS_KEY = 'srr_infr_v1';
var DB = { cage:{}, reading:{}, roomday:{} };
var LATEST = {};        // room|cage → newest cage record from the Sheet (any age)

// ══════════════════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════════════════
function pad(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayStr(){ return ymd(new Date()); }
function nowHM(){ var d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function parseYmd(s){ var p=String(s).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function addDays(s, n){ var d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
function weekStart(s){ var d=parseYmd(s); var w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return ymd(d); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(v){ var n=parseFloat(v); return isNaN(n)?0:n; }
function hrs(on, off){
  if(!on||!off) return null;
  var a=on.split(':'), b=off.split(':');
  var d=(+b[0]*60+(+b[1]||0))-(+a[0]*60+(+a[1]||0)); if(d<0) d+=1440;
  return Math.round(d/60*100)/100;
}
function mins(s,e){ var h=hrs(s,e); return h==null?null:Math.round(h*60); }
// ── TYPED TIME (no clock dial) ──
// Accepts 630, 0630, 6:30, 6.30, 1430, 14, 6, 2pm, 2:30 pm, 12am → "HH:MM" (24-hour)
function normTime(raw){
  var s=String(raw||'').trim().toLowerCase().replace(/\s+/g,'');
  if(!s) return '';
  var pm=/p/.test(s), am=/a/.test(s);
  s=s.replace(/[apm]/g,'').replace(/[.:]+$/,'');
  var h, m;
  var parts=s.split(/[:.\-h]/).filter(String);
  if(parts.length>=2){ h=+parts[0]; m=+parts[1]; }
  else {
    var d=parts[0]||''; if(!/^\d{1,4}$/.test(d)) return null;
    if(d.length<=2){ h=+d; m=0; } else if(d.length===3){ h=+d[0]; m=+d.slice(1); } else { h=+d.slice(0,2); m=+d.slice(2); }
  }
  if(isNaN(h)||isNaN(m)) return null;
  if(pm && h<12) h+=12; if(am && h===12) h=0;
  if(m>59 || h>24 || (h===24 && m>0)) return null;
  return pad(h)+':'+pad(m);
}
function to12(v){
  if(!v||!/^\d\d:\d\d$/.test(v)) return '';
  var h=+v.slice(0,2), m=v.slice(3); if(h===24) return 'midnight';
  return (h%12||12)+':'+m+' '+(h<12?'AM':'PM');
}
// kind: 'rd' = room check field, 'e' = cage editor field, 'per' = lighting period (path light.i.on/off)
function tbox(kind, path, val, id){
  return '<span class="tbx"><input class="in tin" type="text" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="HH:MM"'+(id?' id="'+id+'"':'')+
    ' data-k="'+kind+'" data-p="'+path+'" value="'+esc(val||'')+'" onchange="tChange(this)" onkeydown="if(event.key===\'Enter\')this.blur()">'+
    '<span class="t12">'+to12(val)+'</span></span>';
}
function tChange(el){
  var v=normTime(el.value);
  if(v===null){ el.classList.add('bad'); showToast('Type a time like 6:30 or 1430 or 2pm · အချိန် ရိုက်ပါ','err'); return; }
  el.classList.remove('bad'); el.value=v; el.nextElementSibling.textContent=to12(v);
  var k=el.getAttribute('data-k'), p=el.getAttribute('data-p');
  if(k==='rd') setRD(p,v);
  else if(k==='e') setE(p,v);
  else if(k==='per'){ var a=p.split('.'); RD[a[0]].periods[+a[1]][a[2]]=v; rdDirty=true; updRoomDerived(); }
}
// ── LIGHTING ON-PERIODS (e.g. 06:00–12:00 then 14:00–17:00) ──
function periodsOf(x){
  if(!x) return [];
  if(Array.isArray(x.periods)) return x.periods;
  if(x.on||x.off) return [{on:x.on||'', off:x.off||''}];
  return [];
}
function schedHrs(x){
  var t=null; periodsOf(x).forEach(function(p){ var h=hrs(p.on,p.off); if(h!=null) t=(t||0)+h; });
  return t==null?null:Math.round(t*100)/100;
}
function schedStr(x){ return periodsOf(x).filter(function(p){ return p.on||p.off; }).map(function(p){ return (p.on||'?')+'–'+(p.off||'?'); }).join(', '); }
function fmtH(h){ return h==null?'—':(Math.round(h*10)/10)+' h'; }
function avg(a){ return a.length ? a.reduce(function(x,y){return x+y;},0)/a.length : null; }
function r1(v){ return v==null?'—':Math.round(v*10)/10; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function getPath(o,p){ return p.split('.').reduce(function(x,k){ return x==null?undefined:x[k]; }, o); }
function setPath(o,p,v){ var ks=p.split('.'); var x=o; for(var i=0;i<ks.length-1;i++){ if(x[ks[i]]==null) x[ks[i]] = /^\d+$/.test(ks[i+1])?[]:{}; x=x[ks[i]]; } x[ks[ks.length-1]]=v; }
function roomCages(n){ return ROOMS[n-1].cages; }
function emp(){ return (document.getElementById('emp').value||'').trim(); }
function saveEmp(v){ try{ localStorage.setItem('srr_infr_emp', v); }catch(e){} }
function showToast(m, cls){ var t=document.getElementById('toast'); t.textContent=m; t.className='toast show '+(cls||''); clearTimeout(t._h); t._h=setTimeout(function(){ t.className='toast'; }, 2800); }
function findDef(k){ for(var i=0;i<FIND.length;i++) if(FIND[i].k===k) return FIND[i]; return {k:k,en:k,my:'',c:'#666'}; }

// ══════════════════════════════════════════════════════════════════
// LOCAL STORAGE — memory first; the Sheet is the master copy. This
// device keeps the last 21 days + anything not sent yet. Storage shared
// with the other SRR apps can fill up, so a failed write never blocks a save.
// ══════════════════════════════════════════════════════════════════
function loadLocal(){
  try{
    var d = JSON.parse(localStorage.getItem(LS_KEY)||'null');
    if(d && d.DB){ DB=d.DB; LATEST=d.LATEST||{}; PENDING=d.PENDING||{}; SERVER_TS=d.SERVER_TS||0; }
    ['cage','reading','roomday'].forEach(function(k){ if(!DB[k]) DB[k]={}; });
  }catch(e){}
}
function persist(){
  var cut = addDays(todayStr(), -21);
  ['cage','reading','roomday'].forEach(function(k){
    Object.keys(DB[k]).forEach(function(key){ if(DB[k][key].date < cut && !PENDING[k+'|'+key]) delete DB[k][key]; });
  });
  try{ localStorage.setItem(LS_KEY, JSON.stringify({DB:DB, LATEST:LATEST, PENDING:PENDING, SERVER_TS:SERVER_TS})); }
  catch(e){
    try{ localStorage.setItem(LS_KEY, JSON.stringify({DB:pendingOnly(), LATEST:{}, PENDING:PENDING, SERVER_TS:0})); }catch(e2){}
  }
}
function pendingOnly(){
  var o={cage:{},reading:{},roomday:{}};
  Object.keys(PENDING).forEach(function(pk){ var i=pk.indexOf('|'); var k=pk.slice(0,i), key=pk.slice(i+1); if(DB[k][key]) o[k][key]=DB[k][key]; });
  return o;
}
function keyOf(kind, o){
  if(kind==='cage') return o.room+'|'+o.cage+'|'+o.date;
  if(kind==='reading') return o.room+'|'+o.date+'|'+o.slot;
  return o.room+'|'+o.date;
}

// ══════════════════════════════════════════════════════════════════
// GENE / MORPH PICKER — same list as the Animal ID app
// ══════════════════════════════════════════════════════════════════
var COLOR_GROUPS = [
  { id:'base',    label:'Base Morphs', colors:['FANCY (F)','RED (R)','BLUE BAR (BB)','LEATHERBACK (LB)','DUNNER (D)','GENETIC STRIPE (GS)','COLOR STRIPE (CS)','TRANS (T)','YELLOW (Y)','SNOW (SN)','PASTEL (P)','UC'] },
  { id:'het',     label:'HET', colors:['HET ALBINO (HA)','HET DARK RED (HDR)','HET ZERO (HZ)','HET TRANS (HT)','HET WITBLIT (HW)','HET THUNDERBOLT (HTB)','HET PARADOX (HP)'] },
  { id:'poss',    label:'POSS HET', colors:['POSS HET ZERO ALBINO (PHZA)','POSS HET WITBLIT ALBINO (PHWA)','POSS HET ALBINO (PHA)'] },
  { id:'pure',    label:'Premium Morphs', colors:['ALBINO (A)','DARK RED (DR)','ZERO (Z)','WITBLIT (W)','THUNDERBOLT (TB)','MARBLE (MB)','AXANTHIC (AX)','ZERO TRANS (ZT)'] },
  { id:'special', label:'Special', colors:['GHOST YELLOW (G/Y)','GHOST ORANGE (G/O)','SUPER BLUE (SB)','PHANTOM RED (PR)','CLOWN (CL)','FLAME (FL)','MAGMA (M)','CORAL (C)','PARADOX (PARA)','DOTS (DOTS)'] }
];
var ALL_COLORS = [];
COLOR_GROUPS.forEach(function(g){ ALL_COLORS = ALL_COLORS.concat(g.colors); });
function canonGene(s){ var k=String(s||'').trim().toUpperCase(); for(var i=0;i<ALL_COLORS.length;i++) if(ALL_COLORS[i].toUpperCase()===k) return ALL_COLORS[i]; return String(s||'').trim(); }
function openGenePicker(cur, cb){
  _gpOnConfirm = cb;
  var sel = String(cur||'').split('/').map(canonGene).filter(Boolean);
  var known = {}; ALL_COLORS.forEach(function(c){ known[c]=1; });
  var extra = sel.filter(function(s){ return !known[s]; });
  var h='';
  COLOR_GROUPS.forEach(function(g){
    h+='<div class="gp-group">'+esc(g.label)+'</div><div class="gp-grid">';
    g.colors.forEach(function(c){ h+='<label class="gp-item"><input type="checkbox" class="gp-cb" value="'+esc(c)+'"'+(sel.indexOf(c)>=0?' checked':'')+'> '+esc(c)+'</label>'; });
    h+='</div>';
  });
  h+='<div class="gp-group">Other (type, comma-separated) · အခြား</div><input class="in" id="gp-custom" value="'+esc(extra.join(', '))+'" placeholder="e.g. a morph not on this list">';
  document.getElementById('gp-body').innerHTML=h;
  document.getElementById('gp-modal').classList.add('open');
}
function closeGenePicker(){ document.getElementById('gp-modal').classList.remove('open'); _gpOnConfirm=null; }
function clearGenePicker(){ Array.prototype.forEach.call(document.querySelectorAll('.gp-cb'),function(e){ e.checked=false; }); document.getElementById('gp-custom').value=''; }
function confirmGenePicker(){

function cageRecords(room, cage){
  var out=[];
  Object.keys(DB.cage).forEach(function(k){ var o=DB.cage[k]; if(o.room==room && o.cage==cage) out.push(o); });
  return out;
}
// newest record for a cage on or before a date (local data + the Sheet's latest)
function latestCage(room, cage, onOrBefore){
  var best=null;
  cageRecords(room,cage).forEach(function(o){ if(o.date<=onOrBefore && (!best || o.date>best.date)) best=o; });
  var L = LATEST[room+'|'+cage];
  if(L && L.date<=onOrBefore && (!best || L.date>best.date)) best=L;
  return best;
}
// ── EGG LAYING (each entry = one female that laid; n = her 1st, 2nd, 3rd… time) ──
function ordinal(n){ n=+n; return n===1?'1st':n===2?'2nd':n===3?'3rd':n+'th'; }
var ORD_MY={1:'ပထမအကြိမ်',2:'ဒုတိယအကြိမ်',3:'တတိယအကြိမ်',4:'စတုတ္ထနှင့်အထက်'};
function laidKey(n){ n=Math.round(num(n)); return n>=4?4:(n<1?1:n); }
function laidStr(o){
  var c={}; (o.laid||[]).forEach(function(l){ var k=laidKey(l.n); c[k]=(c[k]||0)+1; });
  return [1,2,3,4].filter(function(k){ return c[k]; }).map(function(k){ return (k===4?'4th+':ordinal(k))+'×'+c[k]; }).join(', ') +
    ((o.laid||[]).some(function(l){ return l.id; }) ? ' ('+(o.laid||[]).map(function(l){ return l.id; }).filter(Boolean).join(', ')+')' : '');
}
// Summary per female group (G1–G6) for one room.
// rangeRecs: cage records whose laying / findings count (dated from–to).
// The cage's current pairing info comes from its newest record up to "to".
function groupSummary(room, from, to, rangeRecs, extraRecs){
  var out={};
  var G=function(k){ k=k||'No group'; if(!out[k]) out[k]={grp:k,cages:0,F:0,M:0,pairs:0,clutches:0,poor:0,laid:0,ev:0,n:{1:0,2:0,3:0,4:0},found:0,checks:0,_ids:{}}; return out[k]; };
  var pool=rangeRecs.concat(extraRecs||[]).filter(function(o){ return o.room==room && o.date<=to; });
  for(var c=1;c<=roomCages(room);c++){
    var best=null;
    pool.forEach(function(o){ if(o.cage==c && (!best||o.date>best.date)) best=o; });
    var L=LATEST[room+'|'+c]; if(L && L.date<=to && (!best||L.date>best.date)) best=L;
    if(!best) continue;
    var g=G(best.fGroup); g.cages++; g.F+=num(best.females); g.M+=num(best.males); g.clutches+=num(best.clutches);
    if(best.paired && !best.apart) g.pairs++; if(best.cond==='Poor') g.poor++;
  }
  var seen={};
  rangeRecs.forEach(function(o){
    if(o.room!=room || o.date<from || o.date>to) return;
    var k=keyOf('cage',o); if(seen[k]) return; seen[k]=1;
    var g=G(o.fGroup); g.checks++; g.found+=(o.found||[]).length;
    (o.laid||[]).forEach(function(l){
      g.ev++; g.n[laidKey(l.n)]++;
      if(l.id){ if(!g._ids[l.id]){ g._ids[l.id]=1; g.laid++; } } else g.laid++;
    });
  });
  var order=GROUPS.concat(['No group']);
  var rows=order.filter(function(k){ return out[k]; }).map(function(k){ return out[k]; });
  var tot={grp:'Room total',cages:0,F:0,M:0,pairs:0,clutches:0,poor:0,laid:0,ev:0,n:{1:0,2:0,3:0,4:0},found:0,checks:0};
  rows.forEach(function(r){ ['cages','F','M','pairs','clutches','poor','laid','ev','found','checks'].forEach(function(f){ tot[f]+=r[f]; }); [1,2,3,4].forEach(function(k){ tot.n[k]+=r.n[k]; }); });
  return {rows:rows, tot:tot};
}

function emptyRoomDay(room,date){
  return {room:room, date:date, notes:'',
    hvac:[{},{},{}], hps:{periods:[{on:'',off:''}],broken:[]}, mh:{periods:[{on:'',off:''}],cages:[]}, lights:{periods:[{on:'',off:''}]},
    aisles:{L:'',M:'',R:''}, lightNotes:'', fans:[{},{}], exhaust:{}, changes:[]};
}
function prevRoomDay(room, beforeDate){
  var best=null;
  Object.keys(DB.roomday).forEach(function(k){ var o=DB.roomday[k]; if(o.room==room && o.date<beforeDate && (!best||o.date>best.date)) best=o; });
  return best;
}
function loadRoomDay(){
  var saved=DB.roomday[curRoom+'|'+curDate];
  if(saved){ RD=clone(saved); RD._from=''; }
  else {
    var p=prevRoomDay(curRoom,curDate);
    if(p){
      RD=clone(p); RD.date=curDate; RD.notes=''; RD.lightNotes=''; RD.changes=[]; RD._from=p.date;
      (RD.hvac||[]).forEach(function(u){ u.n=''; });
      (RD.fans||[]).forEach(function(u){ u.n=''; });
      if(RD.exhaust) RD.exhaust.n='';
    } else RD=emptyRoomDay(curRoom,curDate);
  }
  var base=emptyRoomDay(curRoom,curDate);
  Object.keys(base).forEach(function(k){ if(RD[k]==null) RD[k]=base[k]; });
  while(RD.hvac.length<3) RD.hvac.push({});
  while(RD.fans.length<2) RD.fans.push({});
  if(!RD.hps.broken) RD.hps.broken=[];
  if(!RD.mh.cages) RD.mh.cages=[];
  ['hps','mh','lights'].forEach(function(k){
    var ps=periodsOf(RD[k]).map(function(p){ return {on:p.on||'', off:p.off||''}; });
    if(!ps.length) ps=[{on:'',off:''}];
    RD[k].periods=ps; delete RD[k].on; delete RD[k].off;
  });
  rdDirty=false; readingDraft={};
}
function setRD(p,v){ setPath(RD,p,v); rdDirty=true; updRoomDerived(); }
function segRD(p,v){ setPath(RD,p, getPath(RD,p)===v?'':v); rdDirty=true; renderRoom(); }
function nowRD(p){ setPath(RD,p,nowHM()); rdDirty=true; renderRoom(); }
function cleanedToday(i){ RD.hvac[i].clean=curDate; rdDirty=true; renderRoom(); }

function addPeriod(k){ RD[k].periods.push({on:'',off:''}); rdDirty=true; renderRoom(); }
function delPeriod(k,i){ RD[k].periods.splice(i,1); if(!RD[k].periods.length) RD[k].periods.push({on:'',off:''}); rdDirty=true; renderRoom(); }
function setMH(c,idx,v){
  var a=RD.mh.cages; while(a.length<c) a.push(['','']);
  if(!a[c-1]) a[c-1]=['',''];
  a[c-1][idx]=v===''?'':+v;

  rdDirty=true; renderRoom();
}

function timeIn(p){ return '<div class="timebox">'+tbox('rd',p,getPath(RD,p))+'<button class="btn sm" onclick="nowRD(\''+p+'\')">Now</button></div>'; }
function hChip(id,x){ var h=schedHrs(x); return '<span class="chip '+(h==null?'':'b')+'" id="'+id+'">'+fmtH(h)+'</span>'; }

function slotState(i){
  var s=SLOTS[i], k=curRoom+'|'+curDate+'|'+s.t, saved=DB.reading[k];
  var today=curDate===todayStr(), t=nowHM();
  var next=SLOTS[i+1]?SLOTS[i+1].t:'23:59';
  return {saved:saved, now: today && t>=s.t && t<next, missed: !saved && (curDate<todayStr() || (today && t>=(SLOTS[i+1]?next:'17:00')))};
}
function addMin(hm,m){ var a=hm.split(':'); var x=+a[0]*60+(+a[1])+m; return pad(Math.floor(x/60)%24)+':'+pad(x%60); }

function renderRoom(){
  if(!RD || RD.room!==curRoom || RD.date!==curDate) loadRoomDay();
  var R=RD, n=roomCages(curRoom);
  var page=document.getElementById('page-room');
  var keepY=window.scrollY;

  var t=nowHM(), isToday=curDate===todayStr(), nextS=null, curS=null;
  SLOTS.forEach(function(s,i){ var st=slotState(i); if(st.now) curS=s; if(!nextS && s.t>t) nextS=s; });
  var done=SLOTS.filter(function(s,i){ return slotState(i).saved; }).length;
  if(isToday && curS && !slotState(SLOTS.indexOf(curS)).saved)
    h+='<div class="banner now">🔔 '+curS.l+' check now — log temperature &amp; humidity <span class="my">'+curS.my+' စစ်ဆေးရန်အချိန် — အပူချိန်နှင့် စိုထိုင်းဆ မှတ်ပါ</span></div>';
  else if(isToday && nextS)
    h+='<div class="banner soon">🕐 Next check: '+nextS.l+' <span class="my">နောက်စစ်ဆေးချိန် — '+nextS.my+'</span> <span class="chip" style="margin-left:auto">'+done+' / 8 done · ပြီး</span></div>';

// SYNC — every save goes to this device first, then to the Sheet.
// Anything not confirmed by the Sheet is retried automatically.
// ══════════════════════════════════════════════════════════════════
function saveRecord(kind, o){
  o.emp = emp(); o.updatedAt = Date.now();
  var key=keyOf(kind,o);
  DB[kind][key]=o; PENDING[kind+'|'+key]=true;
  if(kind==='cage'){ var lk=o.room+'|'+o.cage; if(!LATEST[lk] || LATEST[lk].date<=o.date) LATEST[lk]=o; }
  persist(); STATS_CACHE=null; pushPending();
  if(curTab==='groups') renderGroups();
}
function setPill(txt,cls){ var p=document.getElementById('pill'); p.textContent='⬤ '+txt; p.className='pill '+(cls||''); }
function pillState(){
  var n=Object.keys(PENDING).length;
  if(!SHEET_URL) setPill('Not connected · '+n+' on device','warn');
  else if(scriptOutdated) setPill('Sheet script old','err');
  else if(n) setPill(n+' not sent · မပို့ရသေး','warn');
  else setPill('Live ✓ '+nowHM(),'ok');
}
function api(body){
  var q=JSON.stringify(body);
  var url=SHEET_URL+'?payload='+encodeURIComponent(q)+'&t='+Date.now();
  var p = url.length<7000
    ? fetch(url,{method:'GET'})
    : fetch(SHEET_URL,{method:'POST',body:q});   // text/plain → no CORS pre-flight
  return p.then(function(r){ return r.text(); }).then(function(t){
    var j; try{ j=JSON.parse(t); }catch(e){ throw new Error('Sheet did not reply'); }
    if(!j.version || String(j.version)<NEED_SCRIPT_VERSION){ scriptOutdated=true; throw new Error('Sheet script is out of date'); }
    scriptOutdated=false;
    if(!j.ok) throw new Error(j.error||'Sheet error');
    return j;
  });
}
function pushPending(){
  if(!SHEET_URL||pushing){ pillState(); return; }
  var keys=Object.keys(PENDING); if(!keys.length){ pillState(); return; }
  pushing=true; setPill('Saving… · သိမ်းနေ','warn');
  var pk=keys[0], i=pk.indexOf('|'), kind=pk.slice(0,i), key=pk.slice(i+1), obj=DB[kind][key];
  if(!obj){ delete PENDING[pk]; pushing=false; persist(); return pushPending(); }
  var sentAt=obj.updatedAt;
  api({action:'save', kind:kind, obj:obj}).then(function(){
    if(DB[kind][key] && DB[kind][key].updatedAt===sentAt) delete PENDING[pk];
    persist(); pushing=false; pushPending();
  }).catch(function(err){
    pushing=false; pillState(); console.warn('push failed', err);
    if(scriptOutdated) showSetupWarn('⚠️ The Google Sheet script is out of date. Apps Script → Deploy → Manage deployments → ✎ Edit → New version → Deploy. Saves are kept on this device until then. · Sheet script ဟောင်းနေသည်');
  });
}
function mergeList(res){
  var changed=0;
  ['cage','reading','roomday'].forEach(function(kind){
    (res[kind]||[]).forEach(function(o){
      var key=keyOf(kind,o);
      if(PENDING[kind+'|'+key]) return;
      var l=DB[kind][key];
      if(!l || num(o.updatedAt)>=num(l.updatedAt)){ if(!l || num(o.updatedAt)!==num(l.updatedAt)) changed++; DB[kind][key]=o; }
      if(kind==='cage'){ var lk=o.room+'|'+o.cage; if(!LATEST[lk] || LATEST[lk].date<=o.date) LATEST[lk]=o; }
    });
  });
  (res.latest||[]).forEach(function(o){ var lk=o.room+'|'+o.cage; if(!LATEST[lk] || LATEST[lk].date<=o.date) LATEST[lk]=o; });
  if(res.now) SERVER_TS=res.now;
  if(res.lastMod) LAST_MOD=res.lastMod;
  return changed;
}
function pull(){
  if(!SHEET_URL){ pillState(); return Promise.resolve(); }
  var first=!SERVER_TS;
  var req = first ? {action:'list', days:21, latest:1} : null;
  var p = first ? api(req) : api({action:'ping'}).then(function(j){
    if(j.lastMod===LAST_MOD) return null;
    return api({action:'list', since:SERVER_TS-60000});
  });
  return p.then(function(res){

    if(ch){ STATS_CACHE=null; refreshAfterPull(); if(!first) showToast('🔄 '+ch+' update'+(ch>1?'s':'')+' from other devices · ဒေတာအသစ်'); }
    pillState(); pushPending();
  }).catch(function(e){ console.warn('pull failed',e); if(scriptOutdated) pillState(); else setPill('Offline · အင်တာနက်မရှိ','err'); });
}

var RANGES=[{k:'1',l:'Today',my:'ယနေ့'},{k:'7',l:'7 days',my:'၇ ရက်'},{k:'14',l:'14 days',my:'၁၄ ရက်'},{k:'30',l:'30 days',my:'၃၀ ရက်'}];
function renderRangeBtns(){
  document.getElementById('stats-range').innerHTML=RANGES.map(function(r){
    return '<button class="'+(statsRange===r.k?'on ok':'')+'" onclick="setRange(\''+r.k+'\')">'+r.l+'<span class="my">'+r.my+'</span></button>';
  }).join('');
}
function setRange(k){
  statsRange=k; var to=todayStr();
  document.getElementById('st-to').value=to;
  document.getElementById('st-from').value=addDays(to,-(+k-1));
  STATS_CACHE=null; loadStats(true);
}
function localRange(from,to){
  var o={cage:[],reading:[],roomday:[]};
  ['cage','reading','roomday'].forEach(function(k){ Object.keys(DB[k]).forEach(function(key){ var r=DB[k][key]; if(r.date>=from && r.date<=to) o[k].push(r); }); });
  return o;
}
function loadStats(fetchRemote){
  renderRangeBtns();
  var from=document.getElementById('st-from').value, to=document.getElementById('st-to').value;
  if(!from||!to){ setRange(statsRange); return; }
  var local=localRange(from,to);
  var data = (STATS_CACHE && STATS_CACHE.from===from && STATS_CACHE.to===to) ? STATS_CACHE.data : local;
  renderStats(from,to,data);
  var note=document.getElementById('stats-note');
  if(fetchRemote && SHEET_URL && from < addDays(todayStr(),-20)){
    note.textContent='Loading from Sheet… · ဆွဲယူနေ'; note.className='chip a';
    api({action:'list', from:from, to:to, latest:1}).then(function(res){
      mergeList({latest:res.latest});
      var d={cage:res.cage||[], reading:res.reading||[], roomday:res.roomday||[]};
      // add local records not yet in the Sheet
      ['cage','reading','roomday'].forEach(function(k){
        var seen={}; d[k].forEach(function(r){ seen[keyOf(k,r)]=1; });
        local[k].forEach(function(r){ if(!seen[keyOf(k,r)]) d[k].push(r); });
      });
      STATS_CACHE={from:from,to:to,data:d};
      note.textContent='From Sheet ✓ · Sheet မှ'; note.className='chip g';
      renderStats(from,to,d);
    }).catch(function(){ note.textContent='Showing this device\'s data · ဤစက်ရှိ ဒေတာ'; note.className='chip a'; });
  } else { note.textContent=from+' → '+to; note.className='chip b'; }
}
function computeStats(from,to,data){
  var days=[]; for(var d=from; d<=to && days.length<400; d=addDays(d,1)) days.push(d);
  var today=todayStr();
  var countDays=days.filter(function(d){ return d<=today; }).length||1;
  return ROOMS.map(function(R){
    var n=R.cages, s={room:R.n, cages:n};
    var cg=data.cage.filter(function(o){ return o.room==R.n; });
    var uniq={}; cg.forEach(function(o){ uniq[o.cage]=1; });
    s.checks=cg.length; s.uniqueCages=Object.keys(uniq).length;
    var mm=cg.map(function(o){ return mins(o.start,o.end); }).filter(function(x){ return x!=null && x<600; });
    s.avgMin=avg(mm); s.totalMin=mm.reduce(function(a,b){return a+b;},0);
    s.find={}; FIND.forEach(function(f){ s.find[f.k]=0; });
    cg.forEach(function(o){ (o.found||[]).forEach(function(f){ s.find[f.t]=(s.find[f.t]||0)+1; }); });
    s.findTotal=FIND.reduce(function(a,f){ return a+s.find[f.k]; },0);
    var gsum=groupSummary(R.n, from, to, data.cage); s.laid=gsum.tot.laid; s.ln=gsum.tot.n;
    s.dayLaid=days.map(function(d){ var t=0; cg.forEach(function(o){ if(o.date===d) t+=(o.laid||[]).length; }); return t; });
    s.F=0; s.M=0; s.pairs=0; s.clutches=0; s.poor=0; s.fair=0;
    for(var c=1;c<=n;c++){
      var best=null;
      cg.forEach(function(o){ if(o.cage==c && (!best||o.date>best.date)) best=o; });
      var L=LATEST[R.n+'|'+c]; if(L && L.date<=to && (!best||L.date>best.date)) best=L;
      if(!best) continue;
      s.F+=num(best.females); s.M+=num(best.males); s.clutches+=num(best.clutches);
      if(best.paired && !best.apart) s.pairs++;
      if(best.cond==='Poor') s.poor++; if(best.cond==='Fair') s.fair++;
    }
    var rd=data.reading.filter(function(o){ return o.room==R.n; });
    var temps=rd.map(function(o){ return o.temp; }).filter(function(x){ return x!==''&&x!=null; }).map(Number);
    var hums=rd.map(function(o){ return o.hum; }).filter(function(x){ return x!==''&&x!=null; }).map(Number);
    s.tAvg=avg(temps); s.tMin=temps.length?Math.min.apply(null,temps):null; s.tMax=temps.length?Math.max.apply(null,temps):null;
    s.hAvg=avg(hums); s.hMin=hums.length?Math.min.apply(null,hums):null; s.hMax=hums.length?Math.max.apply(null,hums):null;
    s.readings=rd.length; s.readingsExp=countDays*SLOTS.length;
    s.dayTemp=days.map(function(d){ return avg(rd.filter(function(o){ return o.date===d && o.temp!==''&&o.temp!=null; }).map(function(o){ return +o.temp; })); });
    s.dayHum=days.map(function(d){ return avg(rd.filter(function(o){ return o.date===d && o.hum!==''&&o.hum!=null; }).map(function(o){ return +o.hum; })); });
    var ad=data.roomday.filter(function(o){ return o.room==R.n; }).sort(function(a,b){ return a.date<b.date?-1:1; });
    var hv=function(f){ return avg(ad.map(f).filter(function(x){ return x!=null; })); };
    s.hpsH=hv(function(o){ return schedHrs(o.hps); });
    s.mhH=hv(function(o){ return schedHrs(o.mh); });
    s.lightH=hv(function(o){ return schedHrs(o.lights); });
    s.fanH=hv(function(o){ var a=(o.fans||[]).map(function(f){ return hrs(f.on,f.off); }).filter(function(x){ return x!=null; }); return a.length?avg(a):null; });
    s.exH=hv(function(o){ return o.exhaust?hrs(o.exhaust.on,o.exhaust.off):null; });
    s.apDays=ad.length;
    s.hvacProblems=0; ad.forEach(function(o){ (o.hvac||[]).forEach(function(u){ if(u.st==='problem') s.hvacProblems++; }); });
    s.changes=ad.reduce(function(a,o){ return a+((o.changes||[]).length); },0);
    var last=ad[ad.length-1] || prevRoomDay(R.n, addDays(to,1));
    s.lastAp=last?last.date:null;
    if(last){
      s.hvacOn=(last.hvac||[]).filter(function(u){ return u.pw==='on'; }).length;
      s.hpsWorking=40-((last.hps&&last.hps.broken)||[]).length;
      s.mhInst=0; s.mhBad=0; ((last.mh&&last.mh.cages)||[]).forEach(function(c){ if(c){ s.mhInst+=num(c[0]); s.mhBad+=num(c[1]); } });
      var cl=(last.hvac||[]).map(function(u){ return u.clean; }).filter(Boolean).sort();
      s.oldestClean=cl.length?Math.round((parseYmd(to>today?today:to)-parseYmd(cl[0]))/86400000):null;
      s.fansOn=(last.fans||[]).filter(function(f){ return f.pw==='on'; }).length;
    }
    return s;
  });
}

  var from=document.getElementById('h-from').value||'0000', to=document.getElementById('h-to').value||'9999';
  var kind=type==='changes'?'roomday':type;
  var map={}; Object.keys(DB[kind]).forEach(function(k){ map[k]=DB[kind][k]; });
  if(HIST_EXTRA && HIST_EXTRA[kind]) HIST_EXTRA[kind].forEach(function(o){ var k=keyOf(kind,o); if(!map[k]) map[k]=o; });
  return Object.keys(map).map(function(k){ return map[k]; })
    .filter(function(o){ return (room==='all'||o.room==room) && o.date>=from && o.date<=to; })
    .sort(function(a,b){ return a.date===b.date ? (a.room-b.room || num(a.cage)-num(b.cage) || String(a.slot||'').localeCompare(String(b.slot||''))) : (a.date<b.date?1:-1); });
}
function histTable(){
  var type=document.getElementById('h-type').value, rows=histData(), head=[], body=[];
  if(type==='cage'){
    head=['Date','Room','Cage','By','Start','End','Min','♀','♂','♀ Morph','♂ Morph','♀ Grp','♂ Grp','Paired','Apart','Clutches','Condition','🥚 Laid'].concat(FIND.map(function(f){return f.k;})).concat(['Found detail','Notes']);
    body=rows.map(function(o){
      var cnt={}; (o.found||[]).forEach(function(f){ cnt[f.t]=(cnt[f.t]||0)+1; });
      return [o.date,'INFR#'+o.room,o.cage,o.emp,o.start,o.end,mins(o.start,o.end),o.females,o.males,o.fMorph,o.mMorph,o.fGroup,o.mGroup,o.paired,o.apart,o.clutches,o.cond,laidStr(o)]
        .concat(FIND.map(function(f){ return cnt[f.k]||''; }))
        .concat([(o.found||[]).map(function(f){ return f.t+' '+(f.s||'?')+(f.w?' '+f.w+'g':'')+(f.m?' '+f.m:''); }).join('; '), o.notes]);
    });
  } else if(type==='reading'){
    head=['Date','Room','Time','Temp °C','Humidity %','By'];
    body=rows.map(function(o){ return [o.date,'INFR#'+o.room,o.slot,o.temp,o.hum,o.emp]; });
  } else if(type==='roomday'){
    head=['Date','Room','By','HVAC ON','HVAC set °C','HVAC set %','HVAC problems','HPS ON periods','HPS h','HPS working','MH ON periods','MH h','MH broken','Lights ON periods','Lights h','Aisles L/M/R','Fans','Exhaust','Notes'];
    body=rows.map(function(o){
      var hv=o.hvac||[];
      return [o.date,'INFR#'+o.room,o.emp,
        hv.filter(function(u){return u.pw==='on';}).length+'/3', hv.map(function(u){return u.t||'—';}).join(' / '), hv.map(function(u){return u.h||'—';}).join(' / '),
        hv.map(function(u,i){ return u.st==='problem'?'#'+(i+1)+(u.n?' '+u.n:''):''; }).filter(String).join('; '),
        schedStr(o.hps), fmtH(schedHrs(o.hps)), 40-((o.hps&&o.hps.broken)||[]).length,
        schedStr(o.mh), fmtH(schedHrs(o.mh)), ((o.mh&&o.mh.cages)||[]).reduce(function(a,c){ return a+num(c&&c[1]); },0),
        schedStr(o.lights), fmtH(schedHrs(o.lights)),
        ['L','M','R'].map(function(k){ return (o.aisles&&o.aisles[k])||'—'; }).join(' / '),
        (o.fans||[]).map(function(f,i){ return '#'+(i+1)+' '+(f.pw||'—')+(f.on?' '+f.on+'–'+(f.off||''):''); }).join('; '),
        (o.exhaust&&o.exhaust.pw||'—')+(o.exhaust&&o.exhaust.on?' '+o.exhaust.on+'–'+(o.exhaust.off||''):''),
        [o.notes,o.lightNotes].filter(Boolean).join(' | ')];
    });
  } else {
    head=['Date','Room','Change'];
    rows.forEach(function(o){ (o.changes||[]).forEach(function(c){ body.push([o.date,'INFR#'+o.room,c]); }); });
  }
  return {head:head, body:body};
}
function renderHistory(){
  var t=histTable();
  document.getElementById('history-body').innerHTML = t.body.length
    ? '<table class="t"><thead><tr>'+t.head.map(function(x){ return '<th>'+esc(x)+'</th>'; }).join('')+'</tr></thead><tbody>'+
      t.body.map(function(r){ return '<tr>'+r.map(function(x){ return '<td>'+esc(x==null?'':x)+'</td>'; }).join('')+'</tr>'; }).join('')+'</tbody></table>'
    : '<div class="empty">Nothing for these filters. This device keeps the last 21 days — use "Load from Sheet" for older dates. · ဒေတာ မရှိပါ</div>';
}
function loadHistoryRange(){
  if(!SHEET_URL){ showSetupWarn(); return; }
  var from=document.getElementById('h-from').value, to=document.getElementById('h-to').value;
  if(!from||!to){ showToast('Pick From and To dates · ရက်စွဲ ရွေးပါ','err'); return; }
  showToast('Loading… · ဆွဲယူနေ');
  api({action:'list',from:from,to:to}).then(function(res){ HIST_EXTRA=res; renderHistory(); showToast('✅ Loaded · ပြီးပါပြီ','ok'); })
    .catch(function(e){ showToast('⚠️ '+e.message,'err'); });
}
function exportCSV(){
  var t=histTable(); if(!t.body.length){ showToast('Nothing to export','err'); return; }
  var csv=[t.head].concat(t.body).map(function(r){ return r.map(function(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));
  a.download='INFR_'+document.getElementById('h-type').value+'_'+todayStr()+'.csv'; a.click();
}

function tick(){
  var d=new Date();
  document.getElementById('clock').textContent=d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' '+nowHM();
}
document.addEventListener('DOMContentLoaded', function(){
  loadLocal();
  try{ document.getElementById('emp').value=localStorage.getItem('srr_infr_emp')||''; curRoom=+(localStorage.getItem('srr_infr_room')||1)||1; }catch(e){}
  curDate=todayStr(); document.getElementById('date').value=curDate;
  document.getElementById('h-to').value=curDate; document.getElementById('h-from').value=addDays(curDate,-6);
  document.getElementById('st-to').value=curDate; document.getElementById('st-from').value=addDays(curDate,-6);
  renderRooms(); document.getElementById('topbar-card').style.display='none'; renderGroups(); tick(); setInterval(tick, 30000);
  if(!SHEET_URL){ showSetupWarn(); pillState(); }
  else { pull(); setInterval(function(){ pull(); pushPending(); }, 20000); }
  document.addEventListener('visibilitychange', function(){ if(!document.hidden && SHEET_URL){ pull(); pushPending(); } });
  window.addEventListener('online', function(){ if(SHEET_URL){ pull(); pushPending(); } });
  // keep the hourly banner / missed slots current
  setInterval(function(){ if(curTab==='room' && !document.querySelector('#page-room input:focus, #page-room textarea:focus')) renderRoom(); }, 120000);
  window.addEventListener('beforeunload', function(e){ if(rdDirty || editingDirty){ e.preventDefault(); e.returnValue=''; } });
});
